# Schema desejado de labels, aprovado como estrutura operacional em 2026-09-26.
# Este arquivo NÃO aplica labels no GitHub por si só; a existência real deve ser verificada separadamente.
labels:
  - name: "type:epic"
    description: "Resultado agregado composto por duas ou mais Issues."
  - name: "type:issue"
    description: "Entrega executável e verificável."
  - name: "type:sub-issue"
    description: "Etapa delimitada pertencente a uma Issue."
  - name: "area:editorial"
    description: "Produção editorial e derivados."
  - name: "approval:pendente"
    description: "Aprovação humana ainda não concedida."
  - name: "approval:aprovado"
    description: "Aprovação humana explícita registrada."
  - name: "gate:tbd"
    description: "Gate ainda não definido."
  - name: "state:planned"
    description: "0% PLANNED."
  - name: "state:structured"
    description: "33% STRUCTURED."
  - name: "state:implemented"
    description: "66% IMPLEMENTED."
  - name: "state:produced"
    description: "99% PRODUCED."
  - name: "state:verified"
    description: "100% VERIFIED."
  - name: "status:blocked"
    description: "Execução bloqueada por dependência ou decisão."
  - name: "requires-human-decision"
    description: "Ação ou decisão humana obrigatória."
  - name: "priority:alta"
  - name: "priority:media"
  - name: "priority:baixa"

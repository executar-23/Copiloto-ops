    distribution_matrix:
    - channel: Blog
      main_format: Artigo mãe
      funnel_function: Awareness + GEO
      technique_2026: 'Estruturar para citabilidade: dados, fontes, hierarquia clara de títulos, respostas diretas logo após perguntas.'
    - channel: Instagram (feed)
      main_format: Carrossel / imagem
      funnel_function: Consideração
      technique_2026: Autenticidade pesa mais que estética de alcance; evitar padrão "genérico de feed".
    - channel: Reels
      main_format: Vídeo vertical curto
      funnel_function: Descoberta
      technique_2026: Formato dominante de vídeo curto; gancho nos 2 primeiros segundos.
    - channel: TikTok
      main_format: Vídeo vertical curto
      funnel_function: Descoberta
      technique_2026: Nativo obrigatório — conteúdo republicado sem adaptação perde relevância.
    - channel: YouTube Shorts
      main_format: Vídeo vertical curto
      funnel_function: Descoberta + SEO de vídeo
      technique_2026: Usar como porta de entrada para o vídeo mãe (link/comentário fixado).
    - channel: YouTube (longo)
      main_format: Vídeo mãe (8–12 min)
      funnel_function: Consideração + autoridade
      technique_2026: Vídeo segue como formato de maior retenção de atenção; investir em tutorial real, não só opinião.
    - channel: LinkedIn
      main_format: Texto longo, documento ou vídeo nativo
      funnel_function: Autoridade B2B
      technique_2026: Vídeo nativo recebe engajamento muito maior que post estático; algoritmo pondera tempo de leitura, não só reação; evitar link externo no corpo do post (colocar nos comentários).
    - channel: Stories
      main_format: Sequência 10–12 peças
      funnel_function: Ativação + prova social
      technique_2026: 'Manter "quatro portas" abertas em cada sequência: descoberta, prova, urgência e retenção.'
    - channel: Email / Newsletter
      main_format: 3 e-mails por ciclo
      funnel_function: Aprofundamento + venda
      technique_2026: Newsletter é canal de venda, não só aviso; manter nicho claro e cadência regular para sustentar taxa de abertura.
    value_chain_phases:
    - phase: Fase 1 — Produção
      description: Esta entrega. Planejamento estratégico-tático-operacional e produção de todo o conteúdo (texto e roteiros) do ciclo.
      dependency: Tarefas 01–22 (abaixo)
    - phase: Fase 2 — Geração de imagens e vídeos
      description: Transformação dos roteiros e briefings da Fase 1 em assets visuais finalizados (imagens, infográficos, cortes de vídeo).
      dependency: Depende do handoff da Tarefa 22
    - phase: Fase 3 — Revisão
      description: Checagem editorial, de marca e de conformidade de todos os assets antes do agendamento.
      dependency: Depende da Fase 2
    - phase: Fase 4 — Agendamento e publicação
      description: Distribuição nos canais conforme a Matriz do Tópico 6, respeitando a cadência de cada plataforma.
      dependency: Depende da Fase 3
    - phase: Fase 5 — Análise e desempenho
      description: Leitura de métricas por canal e por etapa de funil, retroalimentando o próximo ciclo (etapa "Feedback" do Tópico 2.2).
      dependency: Depende da Fase 4
